name: Azan Reminder

on:
  workflow_dispatch:
    inputs:
      test_now:
        description: "Send all 4 messages right now (test)"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reminder
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_NOW: ${{ inputs.test_now && '1' || '0' }}
        run: python azan_reminder.py
